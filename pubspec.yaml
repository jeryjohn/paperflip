name: paperflip
description: Realistic book page-flip reader with 3D drag-to-curl mesh animation, programmatic control, and full EPUB, PDF, and custom widget support.
version: 0.1.0
homepage: https://github.com/jeryjohn/paperflip
repository: https://github.com/jeryjohn/paperflip

environment:
  sdk: '^3.10.0'
  flutter: '>=3.41.0'

dependencies:
  epub_plus: ^5.1.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.4
  http: ^1.2.0
  meta: ^1.16.0
  pdfrx: ^2.4.4

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

platforms:
  android:
  ios:
  macos:

flutter:
  plugin:
    platforms:
      android:
        package: io.github.jeryjohn.paperflip
        pluginClass: PaperflipPlugin
      ios:
        pluginClass: PaperflipPlugin
      macos:
        pluginClass: PaperflipPlugin
