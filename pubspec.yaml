name: flip_book
description: Realistic book page-flip widget with drag-to-curl animation, programmatic control, and PDF support.
version: 0.1.0
homepage: https://github.com/jeryjohn/paperflip
repository: https://github.com/jeryjohn/paperflip

environment:
  sdk: '^3.10.0'
  flutter: '>=3.41.0'

dependencies:
  epub_plus: ^5.1.0
  flutter:
    sdk: flutter
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.4
  http: ^1.2.0
  meta: ^1.16.0
  pdfrx: ^2.4.4

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
