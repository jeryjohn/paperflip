name: Platform checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-checks:
    name: Package checks (Format, analyze, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze package
        run: flutter analyze

      - name: Fetch public-domain EPUB fixtures
        run: bash tool/fetch_books.sh

      - name: Run package unit and widget tests
        run: flutter test

  example-checks:
    name: Example app checks (Analyze & widget tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check example formatting
        working-directory: example
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze example app
        working-directory: example
        run: flutter analyze

      - name: Run example widget and platform-visibility tests
        working-directory: example
        run: flutter test

  build-android:
    name: Build Android example APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Android APK
        working-directory: example
        run: flutter build apk --debug

  build-darwin:
    name: Build iOS and macOS examples
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build iOS example
        working-directory: example
        run: flutter build ios --no-codesign

      - name: Build macOS example
        working-directory: example
        run: flutter build macos --release

  build-web-experimental:
    name: Web example build (Experimental check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Web
        working-directory: example
        run: flutter build web --release

  build-linux-experimental:
    name: Linux example smoke build (Experimental check)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Generate Linux example runner
        working-directory: example
        run: flutter create --platforms=linux .

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Linux
        working-directory: example
        run: flutter build linux --release

  build-windows-experimental:
    name: Windows example smoke build (Experimental check)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Windows symbolic links
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name 'AllowDevelopmentWithoutDevLicense' -Value 1 -PropertyType DWord -Force | Out-Null

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows example runner
        working-directory: example
        run: flutter create --platforms=windows .

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Windows
        working-directory: example
        run: flutter build windows --release
