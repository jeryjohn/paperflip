name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, fix/pre-release ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze package
        run: flutter analyze

      - name: Fetch test book fixtures
        run: bash tool/fetch_books.sh

      - name: Run package unit and widget tests
        run: flutter test

      - name: Validate example app
        run: |
          cd example
          flutter pub get
          flutter analyze
          flutter test
          flutter build web

      - name: Validate publishing archive
        run: flutter pub publish --dry-run
